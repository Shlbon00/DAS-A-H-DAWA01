<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة حضور الزفاف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b120e; color: #f2ebd9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1000px; margin: 0 auto; background: rgba(20, 36, 26, 0.95); padding: 30px; border-radius: 12px; border: 1px solid #cda45e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1, h2 { color: #cda45e; text-align: center; }
        .login-box { text-align: center; padding: 50px 0; }
        input, button { padding: 12px 20px; margin: 10px; border-radius: 8px; border: 1px solid #cda45e; font-family: 'Tajawal', sans-serif; font-size: 16px; outline: none; }
        input { background: #fff; color: #231c15; width: 250px; }
        button { background: #cda45e; color: #14241a; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #f7e7c4; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 800px; }
        th, td { padding: 12px; border: 1px solid rgba(205,164,94,0.3); text-align: right; }
        th { background: #14241a; color: #cda45e; }
        tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .badge-yes { color: #2ecc71; font-weight: bold; }
        .badge-no { color: #e74c3c; font-weight: bold; }
        .badge-repeat { background: #d35400; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-right: 5px; display: inline-block; }
        #dashboardContent { display: none; }
        .error-msg { color: #e74c3c; margin-top: 10px; font-weight: bold; }
        .stats-bar { display: flex; justify-content: space-around; background: #14241a; padding: 15px; border-radius: 8px; border: 1px solid rgba(205,164,94,0.3); margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 20px; color: #cda45e; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول بكلمة السر -->
        <div id="loginSection" class="login-box">
            <h2>تسجيل دخول لوحة التحكم</h2>
            <p>الرجاء إدخال كلمة السر للمتابعة</p>
            <input type="password" id="passwordInput" placeholder="كلمة السر...">
            <br>
            <button onclick="checkPassword()">دخول</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>

        <!-- محتوى الداشبورد (يظهر بعد كلمة السر الصحيحة) -->
        <div id="dashboardContent">
            <h1>قائمة المدعوين المؤكدين 💍</h1>
            
            <!-- إحصائيات سريعة -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div>إجمالي الردود</div>
                    <div id="totalCount" class="stat-num">0</div>
                </div>
                <div class="stat-item">
                    <div>المؤكد حضورهم 🎉</div>
                    <div id="yesCount" class="stat-num" style="color: #2ecc71;">0</div>
                </div>
                <div class="stat-item">
                    <div>المعتذرون ❌</div>
                    <div id="noCount" class="stat-num" style="color: #e74c3c;">0</div>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span id="lastUpdated" style="font-size: 13px; color: #aaa;"></span>
                <button onclick="loadGuestsData()">تحديث البيانات 🔄</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>م</th>
                            <th>الاسم الكريم</th>
                            <th>الحالة</th>
                            <th>كلمة العرسان</th>
                            <th>وقت والتاريخ الإرسال</th>
                            <th>بصمة الجهاز (Device ID)</th>
                        </tr>
                    </thead>
                    <tbody id="guestsTableBody">
                        <tr><td colspan="6" style="text-align: center;">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // كلمة السر الخاصة بالداشبورد
        const ADMIN_PASSWORD = "123456"; 

        // بيانات الاتصال بقاعدة بيانات Supabase الخاصة بك
        const SUPABASE_URL = 'https://glhamucxcqihocambytb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GXFtytqIlAZTley0bgamkQ_pe2ZnNkj';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function checkPassword() {
            const inputVal = document.getElementById('passwordInput').value;
            if (inputVal === ADMIN_PASSWORD) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                loadGuestsData();
            } else {
                document.getElementById('errorMsg').innerText = "كلمة السر غير صحيحة!";
            }
        }

        async function loadGuestsData() {
            const tbody = document.getElementById('guestsTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">جاري الجلب من قاعدة البيانات...</td></tr>`;

            const { data, error } = await _supabase
                .from('rsvp_guests')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">خطأ في جلب البيانات من Supabase!</td></tr>`;
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">لا يوجد مدعوين سجلوا حتى الآن.</td></tr>`;
                document.getElementById('totalCount').innerText = 0;
                document.getElementById('yesCount').innerText = 0;
                document.getElementById('noCount').innerText = 0;
                return;
            }

            // حساب الإحصائيات ومعرفة التكرارات (سواء بنفس الاسم أو نفس Device ID)
            let yesTotal = 0;
            let noTotal = 0;
            
            // خريطة لحساب عدد مرات تكرار كل اسم أو بصمة جهاز لمعرفة الإرسال المتكرر
            const nameCounts = {};
            const deviceCounts = {};
            
            data.forEach(guest => {
                if(guest.attendance === 'yes') yesTotal++;
                else noTotal++;

                if(guest.name) {
                    const cleanName = guest.name.trim();
                    nameCounts[cleanName] = (nameCounts[cleanName] || 0) + 1;
                }
                if(guest.device_id) {
                    deviceCounts[guest.device_id] = (deviceCounts[guest.device_id] || 0) + 1;
                }
            });

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('yesCount').innerText = yesTotal;
            document.getElementById('noCount').innerText = noTotal;
            
            // عرض وقت آخر تحديث
            const now = new Date();
            document.getElementById('lastUpdated').innerText = `آخر تحديث: ${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG')}`;

            tbody.innerHTML = "";
            data.forEach((guest, index) => {
                const statusText = guest.attendance === 'yes' ? '<span class="badge-yes">حاضر 🎉</span>' : '<span class="badge-no">اعتذر ❌</span>';
                
                // تنسيق التاريخ والوقت بشكل جميل ومقروء بالعربية
                let formattedDate = '-';
                if (guest.created_at) {
                    const d = new Date(guest.created_at);
                    formattedDate = `${d.toLocaleDateString('ar-EG')} | ${d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
                }

                // فحص ما إذا كان المدعو قد أرسل الرد أكثر من مرة (بناءً على تكرار الاسم أو Device ID)
                let repeatBadge = '';
                const isNameRepeated = guest.name && nameCounts[guest.name.trim()] > 1;
                const isDeviceRepeated = guest.device_id && deviceCounts[guest.device_id] > 1;

                if (isNameRepeated || isDeviceRepeated) {
                    repeatBadge = `<span class="badge-repeat" title="قام بإرسال الرد أكثر من مرة">🔄 إعادة إرسال (${(nameCounts[guest.name?.trim()] || 1)})</span>`;
                }

                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${guest.name || 'بدون اسم'} ${repeatBadge}</td>
                    <td>${statusText}</td>
                    <td>${guest.guest_wish || '-'}</td>
                    <td style="font-size: 13px; color: #e2d3b2;">${formattedDate}</td>
                    <td style="font-size: 11px; color: #aaa; font-family: monospace;">${guest.device_id || 'غير متوفر'}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
